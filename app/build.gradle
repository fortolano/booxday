    //noinspection GradleDynamicVersion

    // For xopp file format
    implementation("org.apache.commons:commons-compress:1.28.0") // GZip support
    // LZ4 support. Phase 3 (Oct 2026): maintained fork (org.lz4 1.8.0 has CVE-2025-12183 and
    // CVE-2025-66566); same net.jpountz.lz4 API and block format
    implementation("at.yawk.lz4:lz4-java:1.10.1")
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"

    // for PDF support:
    implementation("com.artifex.mupdf:fitz:1.26.10")

    // OpenRouter API for AI features
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // Markwon for markdown rendering (AI text output)
    implementation "io.noties.markwon:core:4.6.2"

    // MSAL for Microsoft Outlook/Office365 authentication
    // Phase 3 (Oct 2026): pinned (was 5.+, which resolved to 5.10.2)
    implementation("com.microsoft.identity.client:msal:5.10.2") {
        exclude group: 'com.microsoft.device.display', module: 'display-mask'
    }


    // implementation 'org.joda:joda-convert:3.0.1'
    // optional dependency of joda-convert:
    // implementation 'org.threeten:threetenbp:1.7.2'
