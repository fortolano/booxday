plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    // REMOVED: google-services plugin - Firebase not used in codebase
    // id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.compose'

    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Load keystore properties from file (for local builds)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    compileSdk 36

    defaultConfig {
        applicationId "com.boox.day"
        minSdk 29
        targetSdk 35

        versionCode 52
        versionName '1.0.52'
        if (project.hasProperty('IS_NEXT') && project.IS_NEXT.toBoolean()) {
            def timestamp = new Date().format('dd.MM.YYYY-HH:mm')
            versionName = "${versionName}-next-${timestamp}"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        // Only include arm64-v8a native libraries (Boox tablets are all arm64)
        // This reduces APK size by ~90MB by excluding x86, x86_64, armeabi-v7a
        ndk {
            abiFilters 'arm64-v8a'
        }
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        debug {
            if (System.getenv("STORE_FILE") != null) {
                storeFile file(System.getenv("STORE_FILE"))
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            } else if (keystoreProperties['storeFile'] != null) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                println "No signing config found, skipping release signing..."
            }
        }
        release {
            if (System.getenv("STORE_FILE") != null) {
                storeFile file(System.getenv("STORE_FILE"))
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            } else if (keystoreProperties['storeFile'] != null) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                println "No signing config found, skipping release signing..."
            }
        }

    }

    // Hide dependency metadata from Google Play to avoid HiddenApiBypass detection
    // The Onyx SDK requires hidden API access for e-ink display control (TouchHelper, EpdController)
    // Reference: https://github.com/LSPosed/AndroidHiddenApiBypass#google-play
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("boolean", "IS_NEXT", IS_NEXT)
            // No OpenRouter key in the APK (Oct 2026): AI runs only on the user's own key, entered in AI Settings
            // No Cloud Vision key in the APK (Oct 2026): search indexing reads pages with AI on the user's own OpenRouter key
            // Apply signing config if available (env var or keystore.properties)
            if (System.getenv("STORE_FILE") != null || keystoreProperties['storeFile'] != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("boolean", "IS_NEXT", IS_NEXT)
            // No OpenRouter key in the APK (Oct 2026): AI runs only on the user's own key, entered in AI Settings
            // No Cloud Vision key in the APK (Oct 2026): search indexing reads pages with AI on the user's own OpenRouter key
            // Apply signing config if available (env var or keystore.properties)
            if (System.getenv("STORE_FILE") != null || keystoreProperties['storeFile'] != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // Compile lambdas as classes (the Kotlin 1.x way) instead of invokedynamic. With indy,
        // MainScreen's root composable lambda becomes one static method taking ~200 captured
        // values (439 registers); D8's register allocation for that method produced code ART
        // rejects (VerifyError "type Conflict ... if-eqz" on launch, Oct 2026). As a class,
        // captures are fields loaded on demand. No behaviour change.
        freeCompilerArgs += ['-Xlambdas=class']
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_version
    }
    packagingOptions {

        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/license.txt'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/NOTICE.txt'
            excludes += 'META-INF/notice.txt'
        }
        jniLibs {
            // BOOX's SDK includes a link-time INPUT script, not a loadable runtime library.
            // Match OnyxPenDemo: keep libc++_shared.so and exclude this linker-only file.
            excludes += ['**/libc++.so']
            // The migrated wrappers load neopen_jni. The old bundled neo_pen is
            // unused and has 4 KB ELF alignment; retain it in source for rollback only.
            excludes += ['**/libneo_pen.so']
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    namespace 'com.boox.day'
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds true
        abortOnError false
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

