    implementation "androidx.navigation:navigation-compose:2.9.6"

    def room_version = "2.8.4"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // For testing:
    implementation "androidx.room:room-testing-android:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    implementation "io.coil-kt:coil-compose:2.7.0"


    implementation 'com.aventrix.jnanoid:jnanoid:2.0.0'

    // REMOVED: Firebase - not used anywhere in codebase
    // implementation platform('com.google.firebase:firebase-bom:33.16.0')
    // implementation 'com.google.firebase:firebase-analytics-ktx'

    // REMOVED: ML Kit Text Recognition - replaced by Cloud Vision API for unified OCR pipeline
    // implementation 'com.google.mlkit:text-recognition:16.0.1'

    // ML Kit Digital Ink Recognition - used for Tasks handwriting recognition
