tasks.register('printVersionName') {
    println android.defaultConfig.versionName
}

// Dictionary validation task for SemanticGenius classification system
// Validates JSON dictionary files before build to catch issues early
tasks.register('validateDictionaries', Exec) {
    description = 'Validate SemanticGenius classification dictionaries'
    group = 'verification'

    workingDir = rootProject.projectDir

    // Use python3 on Unix, python on Windows
    def pythonCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'

    commandLine pythonCmd,
        'tools/dictionary_validator/validate_dictionaries.py',
        '--dictionaries', 'app/src/main/assets/classification/en',
        '--fail-on-error'

    // Allow task to fail if validation fails
    ignoreExitValue = false
}

tasks.register('validateAndroidListCompatibility') {
    description = 'Block Android-incompatible List convenience APIs in app source'
    group = 'verification'

    def forbiddenListApiPattern = ~/\b(removeFirst|removeLast|getFirst|getLast|addFirst|addLast)\s*\(/

    doLast {
        def violations = []

        fileTree('src/main/java').matching {
            include '**/*.kt'
            include '**/*.java'
        }.each { File sourceFile ->
            sourceFile.eachLine('UTF-8') { line, lineNumber ->
                def trimmed = line.trim()
                if (trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('*')) {
                    return
                }

                def matcher = line =~ forbiddenListApiPattern
                if (matcher.find()) {
                    violations << "${project.relativePath(sourceFile)}:${lineNumber}: ${matcher.group(1)}() is not safe for Android minSdk 29. Use index-based list access instead."
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                "Forbidden Android-incompatible list APIs found:\n" + violations.join('\n')
            )
        }
    }
}

// Make preBuild depend on verification tasks
// This ensures dictionaries and Android API guards are validated before every build
tasks.named('preBuild').configure {
    dependsOn 'validateDictionaries'
    dependsOn 'validateAndroidListCompatibility'
}
