# ical4j settings for CalDAV calendars (plan stage 3), as DAVx5 uses them: accept the small format
# slips real servers make, and keep time zones in memory (the default cache needs JCache, which the
# app doesn't ship). ical4j 3 never fetches time zones from the network.
ical4j.unfolding.relaxed=true
ical4j.parsing.relaxed=true
ical4j.compatibility.outlook=true
net.fortuna.ical4j.timezone.cache.impl=net.fortuna.ical4j.util.MapTimeZoneCache
