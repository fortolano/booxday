[package]
name = "boox-note-android-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
boox-note-parser = { path = "../boox-note-parser" }
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
raqote = { version = "0.8", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
