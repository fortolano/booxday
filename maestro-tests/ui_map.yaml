# Boox Day UI Coordinate Map
# Screen resolution: 1860x2480
# All coordinates are INTEGER percentages (0-100) - Maestro doesn't support decimals!
#
# Usage: Reference these coordinates in Maestro tests
# Last calibrated: 2025-12-31 (from UI hierarchy bounds)
#
# To recalibrate: Run `maestro test calibration_flow.yaml` and update coordinates
#
# IMPORTANT NOTES:
# - Status bar occupies y=0-2% - DO NOT tap in this region
# - Top toolbar icons are at y=3% (center of 10-135px bounds)
# - Toolbar spans FULL WIDTH: x=4% to x=96%
# - After using `- back`, add `- launchApp: clearState: false` as guard

screen:
  width: 1860
  height: 2480

# =============================================================================
# TOP TOOLBAR (y: 3% - icon centers at ~72px from top)
# Left to right: navigation, voice, today, add, sync, refresh, streak, settings
# =============================================================================
toolbar:
  back_arrow:
    x: 4
    y: 3
    description: "Navigate to previous month (<)"

  month_year_label:
    x: 14
    y: 3
    description: "Month/year display (December 2025) - opens month picker"

  forward_arrow:
    x: 25
    y: 3
    description: "Navigate to next month (>)"

  voice_input:
    x: 32
    y: 3
    description: "Voice input button (microphone icon)"

  today_button:
    x: 44
    y: 3
    description: "Jump to today (calendar 31 icon)"

  add_event:
    x: 51
    y: 3
    description: "Add new calendar event (+)"

  sync_accounts:
    x: 59
    y: 3
    description: "Connect Google/Outlook accounts (shows 'Sign in' when not connected)"

  refresh:
    x: 66
    y: 3
    description: "Refresh/sync calendars"

  streak_stats:
    x: 88
    y: 3
    description: "Flame icon - opens user's streak stats for accomplishing tasks"

  settings:
    x: 96
    y: 3
    description: "Settings gear icon - opens preferences dialog"

# =============================================================================
# DRAWING TOOLBAR (y: 46% - below calendar grid, spans horizontally)
# This toolbar changes based on active tab (Memos vs Tasks)
# =============================================================================

# MEMOS TAB TOOLBAR - left to right:
# Memos tab | Tasks tab | Drawing tools | Drawing settings | Eraser | Lasso |
# Image insert | AI features | Boox Notes | Undo | Redo |
# Prev page (<) | Page indicator (1/2) | Next page (>) | Hamburger menu
memos_toolbar:
  memos_tab:
    x: 3
    y: 46
    description: "Memos tab selector (active when on memos)"

  tasks_tab:
    x: 9
    y: 46
    description: "Tasks tab selector"

  drawing_tools:
    x: 13
    y: 46
    description: "Pen/brush style selector"

  drawing_settings:
    x: 17
    y: 46
    description: "Pen size and settings"

  eraser:
    x: 21
    y: 46
    description: "Eraser tool"

  lasso_select:
    x: 25
    y: 46
    description: "Lasso selection tool"

  image_insert:
    x: 28
    y: 46
    description: "Insert image and other content"

  ai_features:
    x: 31
    y: 46
    description: "AI tools (OCR, summarize, etc.)"

  boox_notes:
    x: 35
    y: 46
    description: "Boox Notes integration (B icon with red notification dot)"
 
  undo:
    x: 38
    y: 46
    description: "Undo last action"

  redo:
    x: 41
    y: 46
    description: "Redo action"

  prev_page:
    x: 44
    y: 46
    description: "Previous page (<)"

  page_indicator:
    x: 47
    y: 46
    description: "Current page indicator (e.g., 1/2)"

  next_page:
    x: 49
    y: 46
    description: "Next page (>)"

  hamburger_menu:
    x: 51
    y: 46
    description: "Menu (export, clear, delete page, etc.)"

