# =============================================================================
# CALENDAR GRID (left ~30%, y: 6-44%)
# =============================================================================
calendar:
  # Day of week headers
  header:
    sunday: { x: 3.5%, y: 4% }
    monday: { x: 8%, y: 4% }
    tuesday: { x: 12%, y: 4% }
    wednesday: { x: 16%, y: 4% }
    thursday: { x: 20%, y: 4% }
    friday: { x: 24.5%, y: 4% }
    saturday: { x: 29%, y: 4% }

  # Grid rows (6 rows for month display)
  # Row 1: y ~8%, Row 2: y ~14%, Row 3: y ~20%, Row 4: y ~26%, Row 5: y ~32%, Row 6: y ~38%
  grid:
    row_1_y: 8%
    row_2_y: 14%
    row_3_y: 20%
    row_4_y: 26%
    row_5_y: 32%
    row_6_y: 38%

    # Column X positions (same as header)
    col_sun_x: 3.5%
    col_mon_x: 8%
    col_tue_x: 12%
    col_wed_x: 16%
    col_thu_x: 20%
    col_fri_x: 24.5%
    col_sat_x: 29%

