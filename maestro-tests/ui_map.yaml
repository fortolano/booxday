# =============================================================================
# GESTURES
# =============================================================================
gestures:
  # Swipe patterns for common actions
  scroll_down:
    start: { x: 27%, y: 70% }
    end: { x: 27%, y: 40% }
    duration_ms: 300

  scroll_up:
    start: { x: 27%, y: 40% }
    end: { x: 27%, y: 70% }
    duration_ms: 300

  # Drawing a simple line
  draw_horizontal:
    start: { x: 10%, y: 72% }
    end: { x: 45%, y: 72% }
    duration_ms: 500

  draw_vertical:
    start: { x: 27%, y: 55% }
    end: { x: 27%, y: 90% }
    duration_ms: 500
