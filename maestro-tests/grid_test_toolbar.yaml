appId: com.boox.day
---
# Systematic grid test - map actual tap positions
# Test top toolbar at y=40 with x from 50 to 900 in steps

- launchApp

- runScript:
    file: delay.js
    env:
      DELAY_MS: "8000"

- takeScreenshot: grid/00_baseline

# Test x=50, y=40 (should be back arrow area?)
- tapOn:
    point: "50,40"
- runScript:
    file: delay.js
    env:
      DELAY_MS: "1500"
- takeScreenshot: grid/01_x50_y40
- back
- runScript:
    file: delay.js
    env:
      DELAY_MS: "1000"

